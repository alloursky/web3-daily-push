name: daily-web3-briefing

on:
  schedule:
    # 北京时间 03:30~10:30 每小时一班（共8班）。
    # GitHub 对私有仓库定时任务存在约 2~5 小时的系统性延迟：
    #   - 不延迟：凌晨送达，用户醒来即可看到
    #   - 延迟4.5h：8:00 左右送达
    # 脚本内置"今日已推送"检测，第一班成功后其余自动跳过（一天只发一条）
    - cron: '30 19-23 * * *'
    - cron: '30 0-2 * * *'
  workflow_dispatch:        # 支持手动触发（不受防重发限制）

permissions:
  contents: read
  actions: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and push to WeChat
        run: python fetch_push.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 防止 GitHub 因仓库 60 天无活动自动停用定时任务
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-repo-keepalive@v1
