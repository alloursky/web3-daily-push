name: web3-briefing

on:
  schedule:
    # 北京时间 3:00-17:00 每小时一班（共15班）。
    # 档位定义为 4/7/10/13/16 点（对冲 GitHub 定时延迟约2小时，
    # 实际到达约 6/9/12/15/18 点）；脚本自动判断当前档位，
    # 已推送的档位自动跳过——GitHub 丢几个班次也不影响内容送达。
    - cron: '0 19-23 * * *'    # 北京 3:00 - 7:00
    - cron: '0 0-9 * * *'      # 北京 8:00 - 17:00
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（忽略档位防重发）'
        type: boolean
        default: false

permissions:
  contents: write     # 上传海报与 state.json（增量去重状态）

concurrency:
  group: web3-briefing
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and Chinese font
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow
          wget -q -O font.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf" \
            || wget -q -O font.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          python -c "from PIL import ImageFont; ImageFont.truetype('font.ttf', 30); print('font OK')"

      - name: Fetch alpha and push to WeChat
        run: python fetch_push.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONT_PATH: font.ttf
          PUSH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '' }}
