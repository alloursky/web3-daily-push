name: hot-briefing

on:
  schedule:
    # 北京时间 5:00-9:59 每半小时一班（GitHub 丢班率高，加密密度对冲）。
    # 档位定义为 5/6/7/8/9 点，实际到达约 7/8/9/10/11 点，12 点前发完。
    # 已推送的档位自动跳过——丢多少班次都不影响内容送达。
    - cron: '0,30 21-23 * * *'    # 北京 5:00 - 7:59
    - cron: '0,30 0,1 * * *'      # 北京 8:00 - 9:59
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（忽略档位防重发与额度保护）'
        type: boolean
        default: false

permissions:
  contents: write     # 回写 state.json（增量去重与额度状态）

concurrency:
  group: hot-briefing
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch hot topics and push to WeChat
        run: python fetch_push.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '' }}
