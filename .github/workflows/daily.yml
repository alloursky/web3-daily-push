name: daily-web3-briefing

on:
  schedule:
    # 三班岗（北京时间 08:30 / 09:10 / 09:50），防止 GitHub 高峰期丢任务；
    # 脚本内置"今日已推送"检测，第一班成功后其余自动跳过，不会重发
    - cron: '30 0 * * *'
    - cron: '10 1 * * *'
    - cron: '50 1 * * *'
  workflow_dispatch:        # 支持手动触发（不受防重发限制）

permissions:
  contents: read
  actions: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and push to WeChat
        run: python fetch_push.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
