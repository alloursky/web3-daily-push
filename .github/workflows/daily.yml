name: web3-briefing

on:
  schedule:
    # ===== 正班：北京时间 6 / 9 / 12 / 15 / 18 点整（UTC 前一天22点 + 当天1/4/7/10点）=====
    - cron: '0 22 * * *'      # 北京 06:00
    - cron: '0 1 * * *'       # 北京 09:00
    - cron: '0 4 * * *'       # 北京 12:00
    - cron: '0 7 * * *'       # 北京 15:00
    - cron: '0 10 * * *'      # 北京 18:00
    # ===== 自愈班：每档 +1 小时，若该档已成功推送则脚本自动跳过 =====
    - cron: '0 23 * * *'      # 北京 07:00（兜底 06 档）
    - cron: '0 2 * * *'       # 北京 10:00（兜底 09 档）
    - cron: '0 5 * * *'       # 北京 13:00（兜底 12 档）
    - cron: '0 8 * * *'       # 北京 16:00（兜底 15 档）
    - cron: '0 11 * * *'      # 北京 19:00（兜底 18 档）
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（忽略档位防重发）'
        type: boolean
        default: false

permissions:
  contents: write     # 允许回写 state.json（增量去重的状态文件）
  actions: read

concurrency:
  group: web3-briefing
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and push to WeChat
        run: python fetch_push.py
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '' }}

      - name: Save push state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update push state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi

  # 防止 GitHub 因仓库 60 天无活动自动停用定时任务
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-repo-keepalive@v1
